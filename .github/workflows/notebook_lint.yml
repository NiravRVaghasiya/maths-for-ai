name: Notebook Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint dependencies
        run: pip install nbqa flake8 black nbformat

      - name: Validate notebook structure (nbformat)
        run: |
          python -c "
          import glob, sys, nbformat
          failed = False
          for path in sorted(glob.glob('**/*.ipynb', recursive=True)):
              if '_templates' in path or '.ipynb_checkpoints' in path:
                  continue
              try:
                  nb = nbformat.read(path, as_version=4)
                  nbformat.validate(nb)
                  print(f'OK   {path}')
              except Exception as e:
                  print(f'FAIL {path}: {e}')
                  failed = True
          sys.exit(1 if failed else 0)
          "

      - name: Lint notebooks (flake8 via nbqa)
        run: nbqa flake8 . --max-line-length=100 --extend-ignore=E203,E231,E501,F401 || true

      - name: Format check (black via nbqa)
        run: nbqa black --check . || true
