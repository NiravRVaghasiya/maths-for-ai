name: Colab Execution Test

# Executes notebooks top-to-bottom in a clean environment that mirrors what a learner's
# Google Colab session would have installed, to catch broken cells before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      notebook_glob:
        description: "Glob of notebooks to execute (default: everything)"
        required: false
        default: "**/*.ipynb"

jobs:
  execute:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - 00_Prerequisites
          - 01_Linear_Algebra
          - 02_Calculus
          - 03_Probability_and_Statistics
          - 04_Optimization
          - 05_Information_Theory
          - 06_Numerical_Methods
          - 07_Discrete_Mathematics
          - 08_Advanced_Linear_Algebra
          - 09_Advanced_Probability
          - 10_Differential_Geometry_and_Topology
          - 11_Functional_Analysis
          - 12_Capstone_Projects
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install papermill

      - name: Execute all notebooks in ${{ matrix.module }}
        run: |
          set -e
          shopt -s nullglob
          for nb in "${{ matrix.module }}"/*.ipynb; do
            echo "Executing $nb"
            papermill "$nb" /tmp/executed_output.ipynb --no-progress-bar --kernel python3
          done
