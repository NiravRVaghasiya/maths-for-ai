# Issue-template chooser configuration.
#
# blank_issues_enabled: false forces contributors through one of the structured
# templates below, so every issue arrives with the context a maintainer needs to
# act on it. If none fits, the "Question / discussion" contact link routes to
# Discussions instead of a bare blank issue.
blank_issues_enabled: false
contact_links:
  - name: 💬 Question or discussion
    url: https://github.com/NiravRVaghasiya/maths-for-ai/discussions
    about: >
      For questions about the math, help understanding a notebook, or open-ended
      discussion that isn't a bug, a specific mathematical error, or a concrete
      proposal. Please use Discussions rather than opening an issue.
  - name: 📖 Contribution guide
    url: https://github.com/NiravRVaghasiya/maths-for-ai/blob/main/CONTRIBUTING.md
    about: >
      New here? Start with CONTRIBUTING.md — it has role-based on-ramps for
      mathematicians, ML researchers, educators, and software engineers.
